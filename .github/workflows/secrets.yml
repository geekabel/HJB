# Recherche de secrets dans les commits poussés (le dépôt est public).
# gitleaks-action : https://github.com/gitleaks/gitleaks-action
# Compte personnel : aucune licence n'est nécessaire.
name: Secrets

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
