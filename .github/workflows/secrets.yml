# Search for secrets in pushed commits (the repository is public).
# gitleaks-action : https://github.com/gitleaks/gitleaks-action
# Personal account: no license is needed.
name: Secrets

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
