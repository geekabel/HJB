# Tool configuration. Dependencies stay in requirements*.txt.
# Ruff: https://docs.astral.sh/ruff/configuration/

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: Pyflakes, I: import sorting, B: bugbear,
# UP: up-to-date Python syntax, DJ: Django rules, RUF: Ruff rules.
select = ["E", "W", "F", "I", "B", "UP", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Files generated by Django: we do not rewrite them by hand.
"*/migrations/*" = ["E501", "I001", "RUF012"]
# Model Meta options are lists, as in the Django docs.
"*/models.py" = ["RUF012"]
# Same for form Meta options.
"*/forms.py" = ["RUF012"]
# SVG paths: data, easier to read on a single line.
"ui/templatetags/icons.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
